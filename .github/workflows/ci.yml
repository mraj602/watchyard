# Go side (wy and the hub), the Claude Code pane mod and the end-to-end suites.
name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install spec tools
        run: python -m pip install --disable-pip-version-check --require-hashes -r scripts/ci/requirements.txt

      - name: gofmt
        run: |
          out="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: CGO_ENABLED=0 go build ./...

      - name: go test
        run: go test -race ./...

      - name: spec check (schema load, OpenAPI validation)
        run: make spec-check PYTHON=python

      # A release build has neither the fakeclock nor the fakeopen test seam (builds wy twice,
      # once with the tags as a positive control; never runs it).
      - name: release build has no test seams
        run: scripts/ci/check-release-seams.sh

  # The terminal packages (docs/spec/terminal.md) and everything they touch must work on
  # Windows too (Warp tab_configs path, opener argv, no HOME reads). Required, unlike the
  # best-effort setup e2e below.
  go-windows:
    name: go (windows, terminal packages)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: vet (windows)
        run: GOOS=windows go vet ./internal/board/... ./internal/termctl/... ./internal/warp/... ./internal/termenv/... ./internal/hook/...

      - name: board, termctl, warp, termenv, setup plan and hook tests
        run: go test -race ./internal/board/... ./internal/termctl/... ./internal/warp/... ./internal/termenv/... ./internal/setup/plan/... ./internal/hook/...

  # The Claude Code pane mod (plugin/watchyard-pane): `claude plugin validate` and
  # `claude plugin test` against the pinned Claude Code, the allowed-surface check and tsc.
  # No login and no network beyond npm: scripts/pane-check.sh runs claude in a temp HOME.
  pane-check:
    name: pane mod check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: install Claude Code (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: pane-check
        run: scripts/pane-check.sh

      - name: pane-check self-test (the forbidden fixture must fail)
        run: scripts/pane-check.sh --self-test

  # The web board (webui/): the node unit tests, the Go tests of the embedded app and mock hub,
  # and the headless browser smoke test (webui/smoke, WY_WEBUI_BROWSER=1) in the runner's
  # Google Chrome with a pinned puppeteer-core, on a private D-Bus session so Chrome shows no
  # real notifications. The smoke serves the board with the hub's CSP, so a CSP violation fails it.
  webui-browser:
    name: web board (browser smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"

      - name: node tests
        run: node --test webui/static/*.test.cjs

      - name: go test ./webui/...
        run: go test -race ./webui/...

      - name: install puppeteer-core (pinned, no browser download)
        run: npm install --prefix "$RUNNER_TEMP/pp" --no-save --no-audit --no-fund --ignore-scripts puppeteer-core@25.16.0

      - name: browser smoke (390 and 1440 px, Chrome)
        env:
          WY_WEBUI_BROWSER: "1"
          CHROME: /usr/bin/google-chrome
        run: |
          google-chrome --version
          export WY_PUPPETEER_MODULES="$RUNNER_TEMP/pp/node_modules" WY_WEBUI_SHOTS="$RUNNER_TEMP/shots"
          dbus-run-session -- go test -count=1 -v ./webui/smoke

      - name: screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webui-smoke-shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
          retention-days: 7

  # Terminal end to end (test/e2e/terminal): wy board / term / open / ssh against a fake
  # opener (-tags fakeopen), a temp HOME and no real terminal.
  terminal-e2e:
    name: terminal e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: terminal scenarios
        run: make e2e-terminal

  # Setup end-to-end (test/e2e/setup): the scenarios S1-S8 of test/e2e/setup against
  # `wy` built from this commit and a fake `claude`, as a non-root user in a fresh Fedora and
  # Ubuntu container. Docker has no `--systemd=always`, so the `--hub here` scenario (s6b) is
  # reported as skipped here; it runs with podman on a developer machine.
  setup-e2e:
    name: setup e2e (${{ matrix.distro }}, docker)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [fedora, ubuntu]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: scenarios in the ${{ matrix.distro }} container
        run: make e2e-setup-${{ matrix.distro }} E2E_ENGINE=docker

  # Machines end-to-end (test/e2e/machines): `wy machine add --reach pull` against a real
  # sshd container, the hub pulling its records over SSH, then `wy machine remove`. The host
  # keys are checked strictly; the container has no systemd, and the operator side runs with a
  # temp HOME.
  e2e-machines:
    name: machines e2e (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: wy machine add / pull / remove over SSH
        env:
          WY_E2E_RUNTIME: docker
        run: make e2e-machines

  # The same scenarios on a macOS runner without containers: a temp HOME, the fake claude,
  # `shasum`. S6 (hub join) skips itself here: its timer would be a launchd agent, and tests
  # never bootstrap launchd. The launchd plists are covered by their golden unit tests.
  setup-e2e-macos:
    name: setup e2e (macos, native)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: launchd plist goldens (nothing is bootstrapped)
        run: go test ./internal/timer ./internal/service -run 'Golden|Mac|Launchd' -v

      - name: scenarios, native
        run: test/e2e/setup/run.sh --native

  # Windows is best effort (docs/spec/setup.md 12 risk 8; peers and owner keys are off there,
  # docs/guide/install.md): junctions and synced
  # copies (the share unit tests), install.ps1 against a local release server, and S1 with
  # `.cmd` launchers by hand. Allowed to fail; not run anywhere but here.
  setup-e2e-windows:
    name: setup e2e (windows, best effort)
    runs-on: windows-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.x"
          cache: true

      - name: share unit tests (junctions, copies), timer, launcher and backup tests
        run: go test -race ./internal/share/... ./internal/jsonedit/... ./internal/timer/... ./internal/setup/launcher/... ./internal/setup/backup/...

      - name: build the release archive and the fake claude
        run: |
          out="$PWD/dist/e2e"
          WY_RELEASE_DIR="$out/release" WY_RELEASE_TARGETS=windows_amd64 scripts/release/build.sh 0.0.0-e2e
          mkdir -p "$out/bin" "$out/srv/latest/download"
          go build -o "$out/bin/claude.exe" ./test/e2e/setup/fakeclaude
          cp "$out"/release/* "$out/srv/latest/download/"
          cp "$out/release/install.ps1" "$out/srv/install.ps1"

      - name: install.ps1 against a local server
        shell: pwsh
        run: |
          $srv = Join-Path $PWD 'dist/e2e/srv'
          $port = 18765
          $server = Start-Process -PassThru -WindowStyle Hidden python -ArgumentList '-m', 'http.server', $port, '--bind', '127.0.0.1', '--directory', $srv
          Start-Sleep -Seconds 2
          $env:WY_INSTALL_BASE_URL = "http://127.0.0.1:$port"
          # a locally built archive has no GitHub attestation (as WY_VERIFY_ATTESTATION in test/e2e/setup/lib/common.sh)
          $env:WY_VERIFY_ATTESTATION = '0'
          $home1 = Join-Path $env:RUNNER_TEMP 'home-install'
          New-Item -ItemType Directory -Force -Path $home1 | Out-Null
          $env:USERPROFILE = $home1
          & pwsh -NoProfile -File (Join-Path $srv 'install.ps1') -NoSetup
          if ($LASTEXITCODE -ne 0) { throw "install.ps1 exited $LASTEXITCODE" }
          & (Join-Path $home1 '.local\bin\wy.exe') --version
          if ($LASTEXITCODE -ne 0) { throw "wy --version exited $LASTEXITCODE" }
          # a tampered archive must fail with exit 3 and install nothing
          $bad = Join-Path $env:RUNNER_TEMP 'srv-bad'
          Copy-Item -Recurse $srv $bad
          Get-ChildItem (Join-Path $bad 'latest/download') -Filter 'wy_*.zip' | ForEach-Object { Add-Content -Path $_.FullName -Value 'x' }
          $server2 = Start-Process -PassThru -WindowStyle Hidden python -ArgumentList '-m', 'http.server', ($port + 1), '--bind', '127.0.0.1', '--directory', $bad
          Start-Sleep -Seconds 2
          $env:WY_INSTALL_BASE_URL = "http://127.0.0.1:$($port + 1)"
          $home2 = Join-Path $env:RUNNER_TEMP 'home-bad'
          New-Item -ItemType Directory -Force -Path $home2 | Out-Null
          $env:USERPROFILE = $home2
          & pwsh -NoProfile -File (Join-Path $bad 'install.ps1') -NoSetup
          if ($LASTEXITCODE -ne 3) { throw "tampered archive: want exit 3, got $LASTEXITCODE" }
          if (Test-Path (Join-Path $home2 '.local\bin\wy.exe')) { throw 'wy.exe installed from a tampered archive' }
          Stop-Process -Id $server.Id, $server2.Id -Force
          # the step's exit code is the last native command's (3 from the tampered run): all checks passed
          exit 0

      - name: S1 with .cmd launchers
        run: |
          out="$PWD/dist/e2e"
          home="$RUNNER_TEMP/home-s1"
          mkdir -p "$home"
          sh test/e2e/setup/homes/fresh.sh "$home"
          export USERPROFILE="$(cygpath -w "$home")" HOME="$home"
          export PATH="$out/bin:$PATH"
          mkdir -p "$home/.local/bin"
          unzip -o -q "$out"/release/wy_*_windows_amd64.zip wy.exe -d "$home/.local/bin"
          "$home/.local/bin/wy.exe" setup --yes --json --add work:amber,client --hub later --no-timer > "$RUNNER_TEMP/s1.json"
          test -f "$home/.local/bin/claude-2.cmd"
          test -f "$home/.local/bin/claude-3.cmd"
          grep -q 'CLAUDE_CONFIG_DIR=%USERPROFILE%\\.claude-2' "$home/.local/bin/claude-2.cmd"
          "$home/.local/bin/wy.exe" setup --undo --yes
          test ! -e "$home/.local/bin/claude-2.cmd"
