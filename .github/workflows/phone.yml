# The Android app (phone/): typecheck, lint, jest, the secrets check and both prebuild checks
# on every change, and the release runtime classpath checked for proprietary Google code
# (Firebase, Play services, ML Kit: scripts/check-no-google.mjs); an Android debug compile plus a
# release APK whose dex is checked the same way on main and on demand, and an iOS
# simulator compile on demand only (the iOS code is kept compiling but is not released).
# Nothing is signed, uploaded or submitted, and no EAS command runs here. `make phone-check`
# runs the same checks locally. Spec: docs/spec/phone.md. Action SHAs re-checked with
# `git ls-remote` on 2026-10-13 (actions/setup-java v6.0.1, released 2026-09-09).
name: phone

on:
  workflow_dispatch:
  pull_request:
    paths: ["phone/**", "internal/hub/push/**", ".github/workflows/phone.yml"]
  push:
    branches: [main]
    paths: ["phone/**", "internal/hub/push/**", ".github/workflows/phone.yml"]

permissions:
  contents: read

concurrency:
  group: phone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # typecheck, lint, tests, secrets, and the android and ios prebuild sanity checks
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: phone/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint .
      - run: npx jest --ci
      - run: node scripts/check-no-secrets.mjs
      # prebuild --no-install --clean into a temporary copy of phone/, then assert (phone.md P14)
      - run: node scripts/prebuild-check.mjs android
      - run: node scripts/prebuild-check.mjs ios # the iOS sources stay buildable; the prebuild runs on Linux. No iOS app is released

  # No proprietary Google code on the release runtime classpath (phone.md P13; F-Droid and
  # IzzyOnDroid refuse it). Resolves dependencies only: no compile.
  no-google:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone
    env:
      WY_APP_VARIANT: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: phone/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: phone/package-lock.json
      - run: npm ci
      - run: node scripts/check-no-google.mjs static
      - run: npx expo prebuild --platform android --no-install --clean
      - run: node scripts/check-no-google.mjs gradle

  # native compile (debug), plus a release APK (debug-key signed, one ABI) whose dex must hold no
  # Firebase, Play services or ML Kit class; never uploaded
  android-debug:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone
    env:
      WY_APP_VARIANT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: phone/package-lock.json
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle # ~/.gradle caches; android/ is generated, so key on the npm lockfile
          cache-dependency-path: phone/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install --clean
      - run: ./gradlew :app:assembleDebug :wy-link:testDebugUnitTest :wy-tabs:testDebugUnitTest --no-daemon
        working-directory: phone/android
      - run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
        working-directory: phone/android
      - run: node scripts/check-no-google.mjs apk android/app/build/outputs/apk/release/app-release.apk

  # compile check of the iOS sources for the simulator, no signing (no iOS app is released)
  ios-sim:
    if: github.event_name == 'workflow_dispatch'
    needs: check
    runs-on: macos-latest
    defaults:
      run:
        working-directory: phone
    env:
      WY_APP_VARIANT: development
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: phone/package-lock.json
      - run: npm ci
      - run: npx expo prebuild --platform ios --clean # installs the pods on macOS
      - name: xcodebuild (simulator, unsigned)
        run: |
          ws="$(ls -d ios/*.xcworkspace | head -n 1)"
          scheme="$(basename "$ws" .xcworkspace)"
          xcodebuild -workspace "$ws" -scheme "$scheme" -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO build
